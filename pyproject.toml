[project]
name = "chatbrain"
version = "0.1.0"
description = "BrainChat: a small local model that says what Twitch chat is doing around a Moment"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "src/chatbrain/page/static/fonts/OFL-*.txt"]
authors = [{ name = "Aron-Chu" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "joblib>=1.6.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.33",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
chatbrain = "chatbrain.cli:main"

[build-system]
requires = ["uv_build>=0.10.5,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
